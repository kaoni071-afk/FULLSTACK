<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h2>🌤 Weather Forecast</h2>
        <p>Check the weather around the world</p>
      </header>

      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name..." />
        <button onclick="searchWeather()">Search</button>
        <button class="location-btn" onclick="getLocation()">📍</button>
      </div>

      <p id="message"></p>

      <section class="weather-card">
        <div class="city">
          <h2 id="cityName">Phnom Penh</h2>
          <p id="country">Cambodia</p>
          <p id="date">Loading...</p>
        </div>

        <div class="weather-main">
          <div id="weatherIcon">🌤️</div>
          <h1 id="temperature">--°C</h1>
          <h3 id="description">Loading...</h3>
        </div>

        <div class="details">
          <div class="detail">
            <span>💧</span>
            <p>Humidity</p>
            <h3 id="humidity">--%</h3>
          </div>

          <div class="detail">
            <span>💨</span>
            <p>Wind Speed</p>
            <h3 id="wind">-- km/h</h3>
          </div>

          <div class="detail">
            <span>🌡️</span>
            <p>Feels Like</p>
            <h3 id="feels">--°C</h3>
          </div>

          <div class="detail">
            <span>☀️</span>
            <p>UV Index</p>
            <h3 id="uv">--</h3>
          </div>
        </div>
      </section>

      <section class="forecast-section">
        <h2>7 Days Forecast</h2>
        <div id="forecast" class="forecast-grid"></div>
      </section>

      <footer>
        <p>Weather Forecast Website © 2026</p>
        <p>Weather data by Open-Meteo</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
